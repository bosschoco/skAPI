# ─────────────────────────────────────────────
#  skAPI 설정 파일
#  변경 후 /skapi reload 로 다시 불러올 수 있습니다.
# ─────────────────────────────────────────────

http:
  # 요청 하나가 응답을 기다리는 최대 시간(초)
  # 스크립트에서 'set api timeout of {_req} to 30 seconds' 로 요청마다 바꿀 수 있습니다.
  default-timeout: 15

  # 서버에 연결될 때까지 기다리는 최대 시간(초)
  connect-timeout: 10

  # 3xx 리다이렉트를 자동으로 따라갈지 여부
  follow-redirects: true

  # 요청에 User-Agent 헤더가 없을 때 사용할 기본값
  user-agent: "skAPI"

sync:
  # 메인 스레드에서 동기(sync) 요청이 실행되면 콘솔에 경고를 남깁니다. (1분에 최대 1번)
  # 동기 요청은 응답이 올 때까지 서버 전체가 멈추므로 가능하면 비동기 방식을 쓰세요.
  warn-on-main-thread: true

  # 메인 스레드 동기 요청의 타임아웃 상한(초).
  # 요청 타임아웃이 이보다 길어도 이 시간까지만 기다립니다. (서버 장시간 멈춤 방지)
  max-main-thread-timeout: 5

# 요청/응답 로그를 콘솔에 출력합니다. (문제 해결용)
debug: false
